name: Collect food deals daily
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum products to check'
        type: choice
        default: '2500'
        options: ['60', '2500']
permissions:
  contents: read
concurrency:
  group: food-deal-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/collect-food-deals.ts
        env:
          DATABASE_URL: ${{ secrets.FOOD_DEALS_DATABASE_URL }}
          FOOD_DEALS_LIMIT: ${{ inputs.limit || '2500' }}
