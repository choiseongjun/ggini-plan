name: Send meal reminders
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meal-reminders
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch due meal reminders
        run: |
          curl -fsS -X POST "$APP_URL/api/push/dispatch" -H "x-cron-secret: $CRON_SECRET" --max-time 90
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
